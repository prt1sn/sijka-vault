# Cargo workspace of the sijka-vault program.

[workspace]
resolver = "3"
members = ["programs/sijka-vault"]

[workspace.metadata.cli]
solana = "4.3.0"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
debug = false
incremental = false
